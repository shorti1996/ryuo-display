[project]
name = "ryuo-display"
version = "0.1.0"
description = "Linux control panel for the AMOLED screen of the ASUS ROG RYUO IV: live PC stats, your own videos and a second-monitor mode"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# Runtime is the standard library plus the ffmpeg and adb binaries; the tray also needs PySide6
# (python3-pyside6 on Fedora). imageio-ffmpeg supplies an ffmpeg binary when none is on PATH, but
# only under `uv run`: the installed service runs /usr/bin/python3, which can't import it.
dependencies = [
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# re/ext/ holds third-party clones that must never run; `pytest .` would otherwise import their tests.
norecursedirs = ["re", "web", ".*", "build", "dist", "node_modules", "venv", "__pycache__"]

[tool.ruff]
line-length = 125
extend-exclude = ["re", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
