[project]
name = "rog-ryuo-lcd"
version = "0.1.0"
description = "Linux driver, stats daemon and tray for the ASUS ROG RYUO IV pump LCD"
requires-python = ">=3.12"
# Runtime is the standard library plus the ffmpeg and adb binaries; the tray also needs PySide6
# (python3-pyside6 on Fedora). imageio-ffmpeg supplies an ffmpeg binary when none is on PATH;
# ryuod imports it only for that fallback and runs without it.
dependencies = [
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# re/ext/ holds third-party clones that must never run; `pytest .` would otherwise import their tests.
norecursedirs = ["re", "web", ".*", "build", "dist", "node_modules", "venv", "__pycache__"]

[tool.ruff]
line-length = 125
extend-exclude = ["re", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
